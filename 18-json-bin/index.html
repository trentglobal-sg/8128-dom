<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <h1>Book Managment System</h1>
    <h2>Add New</h2>
    <div class="mb-3">
      <div>
        <label>Title:</label>
        <input type="text" id="title" class="form-control" />
      </div>
      <div>
        <label>Author</label>
        <input type="text" id="author" class="form-control" />
      </div>
      <div>
        <label>Pages</label>
        <input type="text" id="pages" class="form-control" />
      </div>
      <button id="addBtn" class="btn btn-primary btn-sm mt-2">Add</button>
    </div>

    <div>
      <button id="saveBtn" class="btn btn-primary btn-sm m-1">Save</button>
      <ul class="list-group" id="bookList">
        <!-- each record here -->
      </ul>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
