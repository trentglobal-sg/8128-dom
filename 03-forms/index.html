<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <label>Email</label>
        <input type="text" id="email" />
    </div>
    <div>
        <label>Age Group</label>
        <input type="radio" name="age-group" value="young-adult" class="age-group">
        <label>Young Adults (Up to 25 years old)</label>

        <input type="radio" name="age-group" value="middle-age" class="age-group">
        <label>Middle Age (26 to 40 years old)</label>

        <input type="radio" name="age-group" value="young-senior" class="age-group">
        <label>Young Seniors (41 years and above)</label>
    </div>
    <div>
        <label>Hobbies</label>
        <input type="checkbox" name="hobbies" class="hobbies" value="chess" />
        <label>Chess</label>

        <input type="checkbox" name="hobbies" class="hobbies" value="sleep" />
        <label>Sleep</label>

        <input type="checkbox" name="hobbies" class="hobbies" value="netflix" />
        <label>Netflix</label>

        <input type="checkbox" name="hobbies" class="hobbies" value="others" />
        <label>Others</label>
    </div>
    </div>
    <button id="submitBtn">Submit</button>
    <script src="script.js"></script>
</body>

</html>
