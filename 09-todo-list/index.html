<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="mb-2">
            <h1>Add new todo</h1>
            <div class="mt-3">
                <label class="form-label">Todo Name:</label>
                <input type="text" id="todoName" class="form-control" placeholder="Todo name" />
            </div>
            <div class="mt-3">
                <label class="form-label">Urgency</label>
                <select id="taskUrgency" class="form-control">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>

                </select>
            </div>
            <!-- <input type="submit" value="Add Todo" class="btn btn-primary mt-2"/> -->
            <button class="mt-3 btn btn-primary" id="addBtn">Add Todo</button>
        </div>
        <h1>Todo List</h1>
        <ul id="todoList" class="list-group">

        </ul>



    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- when we refer to multiple js files in a html file
     the js files are processed in order
     
     All global variables and functions from a js file is shared with
     all other js files.

     So we need to include third parties and library JS files first
     -->

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
